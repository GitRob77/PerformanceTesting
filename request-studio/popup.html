<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UiPath Request Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #f8f9fa;
      color: #1a1a2e;
    }

    /* Header */
    .header {
      background: #fff;
      border-top: 3px solid #fa4616;
      padding: 12px 16px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #e8eaed;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .logo-svg { flex-shrink: 0; }
    .logo-text { display: flex; flex-direction: column; line-height: 1; }
    .logo-brand { font-size: 13px; font-weight: 700; color: #1a1a2e; letter-spacing: -0.2px; }
    .logo-brand span { color: #fa4616; }
    .logo-sub { font-size: 9px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }

    /* Status card */
    .status-card {
      margin: 12px 14px 0;
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e8eaed;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #d1d5db;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .status-dot.active {
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.2);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(34,197,94,0.2); }
      50%       { box-shadow: 0 0 0 5px rgba(34,197,94,0.08); }
    }
    .status-info { flex: 1; }
    .status-text { font-size: 12px; font-weight: 600; color: #374151; }
    .entry-count { font-size: 11px; color: #9ca3af; margin-top: 1px; }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 6px;
      padding: 10px 14px;
    }
    .btn {
      flex: 1;
      padding: 7px 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      letter-spacing: 0.1px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-start  { background: #fa4616; color: #fff; }
    .btn-start:hover:not(:disabled)  { background: #e63f14; }
    .btn-stop   { background: #1f2937; color: #fff; }
    .btn-stop:hover:not(:disabled)   { background: #111827; }
    .btn-viewer { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
    .btn-viewer:hover { background: #dbeafe; }

    .btn-row-2 {
      display: flex;
      gap: 6px;
      padding: 0 14px 12px;
    }
    .btn-clear  { background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; }
    .btn-clear:hover { background: #e5e7eb; }

    .hidden { display: none !important; }

    /* Footer */
    .footer {
      border-top: 1px solid #e8eaed;
      padding: 8px 14px;
      font-size: 10px;
      color: #9ca3af;
      text-align: center;
    }
    .footer span { color: #fa4616; font-weight: 600; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-wrap">
      <!-- UiPath logomark -->
      <svg class="logo-svg" width="24" height="24" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="8" fill="#FA4616"/>
        <path d="M20 8C13.373 8 8 13.373 8 20C8 26.627 13.373 32 20 32C26.627 32 32 26.627 32 20C32 13.373 26.627 8 20 8ZM20 28C15.582 28 12 24.418 12 20C12 15.582 15.582 12 20 12C24.418 12 28 15.582 28 20C28 24.418 24.418 28 20 28Z" fill="white" fill-opacity="0.3"/>
        <circle cx="20" cy="20" r="5" fill="white"/>
      </svg>
      <div class="logo-text">
        <div class="logo-brand"><span>Ui</span>Path</div>
        <div class="logo-sub">Request Studio</div>
      </div>
    </div>
  </div>

  <!-- Status card -->
  <div class="status-card">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-info">
      <div class="status-text" id="statusText">Ready to capture</div>
      <div class="entry-count" id="entryCount">0 requests captured</div>
    </div>
  </div>

  <!-- Primary action buttons -->
  <div class="btn-row">
    <button class="btn btn-start" id="btnStart">▶ Start</button>
    <button class="btn btn-stop hidden" id="btnStop">■ Stop</button>
    <button class="btn btn-viewer" id="btnViewer">Open Studio →</button>
  </div>

  <!-- Secondary buttons -->
  <div class="btn-row-2">
    <button class="btn btn-clear" id="btnClear">🗑 Clear</button>
  </div>

  <div class="footer">
    <span>UiPath</span> Request Studio v1.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
